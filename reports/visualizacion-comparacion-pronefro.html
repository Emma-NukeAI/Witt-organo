<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparación Lado a Lado · Cascada Pronefro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    color: #E8E4DF;
  }
  #canvas { width: 100vw; height: 100vh; display: block; position: fixed; top: 0; left: 0; z-index: 0; }

  /* HUD */
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 14px 24px 12px;
    background: linear-gradient(180deg, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0) 100%);
    pointer-events: none;
    z-index: 10;
    height: 80px;
  }
  .hud-title { font-size: 14px; font-weight: 600; letter-spacing: 1px; color: #E8E4DF; }
  .hud-sub { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: #8A847D; margin-top: 3px; }
  .hud-row { display: flex; gap: 18px; margin-top: 7px; font-size: 12px; color: #B5B0A8; align-items: center; }
  .hud-row strong { color: #4ECDC4; font-weight: 500; }

  .layout-switcher {
    pointer-events: auto;
    display: flex;
    gap: 4px;
    margin-left: auto;
    background: rgba(20, 20, 20, 0.6);
    border: 1px solid #2A2A2A;
    border-radius: 4px;
    padding: 2px;
  }
  .layout-btn {
    background: none;
    border: none;
    color: #8A847D;
    padding: 4px 12px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.18s;
  }
  .layout-btn:hover { color: #E8E4DF; }
  .layout-btn.active {
    background: rgba(78, 205, 196, 0.18);
    color: #4ECDC4;
  }

  /* Panel headers (per-panel overlay at top) */
  .panel-header {
    position: fixed;
    top: 80px;
    height: 60px;
    z-index: 11;
    padding: 8px 12px;
    background: linear-gradient(180deg, rgba(15,15,15,0.85) 0%, rgba(10,10,10,0.4) 100%);
    border-left: 1px solid rgba(60,60,60,0.4);
    border-right: 1px solid rgba(60,60,60,0.4);
    pointer-events: none;
  }
  .panel-header-inner {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(78,205,196,0.15);
    color: #4ECDC4;
    border: 1px solid rgba(78,205,196,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
  }
  .panel-select {
    pointer-events: auto;
    flex: 1;
    background: rgba(30, 30, 30, 0.9);
    color: #E8E4DF;
    border: 1px solid #3A3A3A;
    border-radius: 4px;
    padding: 5px 26px 5px 10px;
    font-family: inherit;
    font-size: 12px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M1 1l4 4 4-4' stroke='%238A847D' stroke-width='1.5' fill='none' stroke-linecap='round'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
  }
  .panel-select:hover { border-color: #4ECDC4; }
  .panel-select:focus { outline: none; border-color: #4ECDC4; }

  .panel-stagepill {
    margin-top: 5px;
    display: inline-block;
    padding: 1px 7px;
    border-radius: 8px;
    font-size: 9px;
    letter-spacing: 0.6px;
    background: rgba(60,60,60,0.5);
    color: #B5B0A8;
    border: 1px solid rgba(80,80,80,0.5);
  }
  .panel-stagepill.s0 { background: rgba(78,205,196,0.15); color: #4ECDC4; border-color: rgba(78,205,196,0.3); }
  .panel-stagepill.s1 { background: rgba(214, 113, 78, 0.15); color: #D4724E; border-color: rgba(214,113,78,0.3); }
  .panel-stagepill.s2 { background: rgba(155, 90, 138, 0.18); color: #C880B0; border-color: rgba(155,90,138,0.35); }

  /* Panel footers (per-panel overlay at bottom) */
  .panel-footer {
    position: fixed;
    height: 80px;
    z-index: 11;
    padding: 10px 12px;
    background: linear-gradient(0deg, rgba(15,15,15,0.88) 0%, rgba(10,10,10,0.2) 100%);
    border-left: 1px solid rgba(60,60,60,0.4);
    border-right: 1px solid rgba(60,60,60,0.4);
    pointer-events: none;
    overflow: hidden;
  }
  .panel-footer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .conf-pill {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 8px;
    border: 1px solid;
  }
  .decouple-pill {
    font-size: 9px;
    letter-spacing: 0.4px;
    padding: 2px 7px;
    border-radius: 8px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .decouple-pill.pass { background: rgba(45, 106, 79, 0.25); color: #7FB069; }
  .decouple-pill.partial { background: rgba(184, 134, 11, 0.25); color: #D4A442; }
  .decouple-pill.fail { background: rgba(180, 77, 77, 0.25); color: #E68A8A; }
  .decouple-pill.na { background: rgba(60,60,60,0.4); color: #8A847D; }

  .ablation-tag {
    font-size: 9px;
    letter-spacing: 0.3px;

    position: absolute;

    position: absolute;

  .am-end   { width: 3px; background: rgba(127, 176, 105, 0.8); }
  .am-label {
    position: absolute;
    top: -16px;
    font-size: 9px;

    align-items: center;

    color: #8A847D;

    position: fixed;

    left: 50%;

    border: 1px solid rgba(212, 164, 66, 0.4);
    border-radius: 4px;

    letter-spacing: 0.5px;

  /* Stage indicators in HUD */
  .stage-dots {
    display: flex;
    gap: 3px;
    margin-left: 10px;
  }
  .stage-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #2A2A2A;
    transition: background 0.2s;
  }
  .stage-dot.active { background: #4ECDC4; box-shadow: 0 0 6px rgba(78,205,196,0.6); }
  .stage-dot.done { background: #2D6A4F; }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// SCENARIOS
// ============================================================
const SCENARIOS = {

  '1B-hipo': {

  },
  '1B-KO': {

    stage: 1,
    ablationWindow: [0.13, 1.0],
    ablationMode: 'B',
    dose: 0.95,
    confidence: 0.55,
    decouple: 'fail',
    decoupleLabel: 'FALLA',
    pheno: 'Catastrófico · identidad comprometida · sin pronefro reconocible.',
  },
  '2A-hipo': {
    label: '2A · stage-specific · hipo',
    stage: 2,
    ablationWindow: [0.32, 0.46],
    ablationMode: 'A',
    dose: 0.50,
    confidence: 0.80,
    decouple: 'pass',
    decoupleLabel: 'PASA',
    pheno: 'Túbulo ~70–80% longitud · comprimido AP · posición correcta · lumen formado.',
  },
  '2A-KO': {
    label: '2A · stage-specific · KO',
    stage: 2,
    ablationWindow: [0.32, 0.46],
    ablationMode: 'A',
    dose: 0.95,
    confidence: 0.75,
    decouple: 'pass',
    decoupleLabel: 'PASA',
    pheno: 'Quiste compacto · cluster esférico sin túbulo lineal.',
  },
  '2B-hipo': {
    label: '2B · persistente · hipo',
    stage: 2,
    ablationWindow: [0.32, 1.0],
    ablationMode: 'B',
    dose: 0.50,
    confidence: 0.66,
    decouple: 'partial',
    decoupleLabel: 'PARCIAL',
    pheno: 'Comprimido + falla polaridad · posición AP correcta (distinto de 1B).',
  },
  '2B-KO': {
    label: '2B · persistente · KO',
    stage: 2,
    ablationWindow: [0.32, 1.0],
    ablationMode: 'B',
    dose: 0.95,
    confidence: 0.58,
    decouple: 'pass',
    decoupleLabel: 'PASA paradigma',
    pheno: 'Sin túbulo · foci wt1a+ dispersos · identidad preservada (vs 1B-KO).',
  },
};

const SCENARIO_ORDER = ['control','1A-hipo','1A-KO','1B-hipo','1B-KO','2A-hipo','2A-KO','2B-hipo','2B-KO'];

// Default scenarios per panel count
const DEFAULT_SCENARIOS = {
  2: ['control', '1A-hipo'],
  3: ['control', '1A-hipo', '2A-hipo'],
  4: ['control', '1A-hipo', '2A-hipo', '2A-KO'],
};

// ============================================================
// STAGES
// ============================================================
const STAGES = [
  { name: 'blástula',                    short: 'blastula', t0: 0.00, t1: 0.13, hpf: '3–6 hpf' },
  { name: 'gastrul. · mesendodermo',     short: 'gastr',    t0: 0.13, t1: 0.30, hpf: '6–10 hpf' },
  { name: 'LPM bilateral · IM emergente', short: 'LPM/IM',  t0: 0.30, t1: 0.50, hpf: '10–14 hpf' },
  { name: 'MET · pre-tubulogénesis',     short: 'MET',      t0: 0.50, t1: 0.72, hpf: '14–18 hpf' },
  { name: 'túbulo · lumenogénesis',      short: 'túbulo',   t0: 0.72, t1: 1.00, hpf: '18–24 hpf' },
];

function getStage(t) {
  for (let i = 0; i < STAGES.length; i++) {
    if (t >= STAGES[i].t0 && t < STAGES[i].t1) return { ...STAGES[i], index: i };
  }
  return { ...STAGES[STAGES.length-1], index: STAGES.length-1 };
}
function tToHpf(t) { return (3 + t * 21).toFixed(1); }

// ============================================================
// SHARED RESOURCES
// ============================================================
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x0a0a0a);
renderer.autoClear = false;

// Shared camera
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(2.8, 1.6, 3.2);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

// Shared body geometry (deforms once per frame, used by all panels)
const bodyGeometry = new THREE.SphereGeometry(1, 64, 48);
const bodyOrigPositions = bodyGeometry.attributes.position.array.slice();
const bodyMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xE8E0D0,
  roughness: 0.55, metalness: 0.0,
  clearcoat: 0.4, clearcoatRoughness: 0.4,
  transparent: true, opacity: 0.22, side: THREE.DoubleSide,
});
const wireMaterial = new THREE.MeshBasicMaterial({
  color: 0x6A6660, wireframe: true, transparent: true, opacity: 0.05,
});

// Shared cell geometry
const cellGeometry = new THREE.SphereGeometry(0.06, 12, 10);
const cellMaterial = new THREE.MeshPhysicalMaterial({
  roughness: 0.45, metalness: 0.0,
  clearcoat: 0.5, clearcoatRoughness: 0.3,
});

const N_CELLS_PER_SIDE = 60;
const N_CELLS = N_CELLS_PER_SIDE * 2;

// Colors
const COL_MESODERM   = new THREE.Color(0xD6856B);
const COL_IM         = new THREE.Color(0xD4724E);
const COL_PROGENITOR = new THREE.Color(0x9B5A8A);
const COL_TUBULE     = new THREE.Color(0x4A8FA5);
const COL_PERTURB    = new THREE.Color(0xE63946);

function fateColor(t) {
  if (t < 0.20) return COL_MESODERM;
  if (t < 0.42) return COL_MESODERM.clone().lerp(COL_IM, (t - 0.20) / 0.22);
  if (t < 0.58) return COL_IM.clone().lerp(COL_PROGENITOR, (t - 0.42) / 0.16);
  return COL_PROGENITOR.clone().lerp(COL_TUBULE, Math.min(1, (t - 0.58) / 0.20));
}

function rand(seed) {
  const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

function deformBody(t) {
  const positions = bodyGeometry.attributes.position;
  for (let i = 0; i < positions.count; i++) {
    const ix = i * 3;
    const x = bodyOrigPositions[ix];
    const y = bodyOrigPositions[ix + 1];
    const z = bodyOrigPositions[ix + 2];
    let sx, sy, sz, headBulge = 0, tailTaper = 1;
    if (t < 0.13) { sx = sy = sz = 1.0; }
    else if (t < 0.30) {
      const lt = (t - 0.13) / 0.17;
      sx = 1.0 - 0.10 * lt; sy = 1.0 - 0.05 * lt; sz = 1.0 + 0.35 * lt;
    } else if (t < 0.50) {
      const lt = (t - 0.30) / 0.20;
      sx = 0.90 - 0.15 * lt; sy = 0.95 - 0.10 * lt; sz = 1.35 + 0.45 * lt;
    } else if (t < 0.72) {
      const lt = (t - 0.50) / 0.22;
      sx = 0.75 - 0.10 * lt; sy = 0.85 - 0.10 * lt; sz = 1.80 + 0.50 * lt;
      if (z > 0.4) headBulge = (z - 0.4) * 1.5 * 0.12 * lt;
    } else {
      const lt = (t - 0.72) / 0.28;
      sx = 0.65 - 0.05 * lt; sy = 0.75 - 0.05 * lt; sz = 2.30 + 0.40 * lt;
      if (z > 0.4) headBulge = (z - 0.4) * 1.5 * (0.12 + 0.10 * lt);
      if (z < -0.3) tailTaper = 1.0 - Math.abs(z + 0.3) * 0.5 * lt;
    }
    positions.setXYZ(i,
      x * sx * tailTaper + (z > 0.4 ? x * headBulge : 0),
      y * sy * tailTaper + (z > 0.4 ? y * headBulge : 0),
      z * sz
    );
  }
  positions.needsUpdate = true;
  bodyGeometry.computeVertexNormals();
}

function computeCellPosition(cellId, t, scenario) {
  const side = cellId < N_CELLS_PER_SIDE ? -1 : 1;
  const apIndex = cellId % N_CELLS_PER_SIDE;
  const apNorm = (apIndex / (N_CELLS_PER_SIDE - 1)) - 0.5;
  const seed = cellId * 7.3;

  let lateralFactor, apFactor, dorsalFactor;
  if (t < 0.13) {
    lateralFactor = 0.55 + (rand(seed) - 0.5) * 0.2;
    apFactor = 0.55 + (rand(seed + 1) - 0.5) * 0.25;
    dorsalFactor = 0.25 + (rand(seed + 2) - 0.5) * 0.4;
  } else if (t < 0.30) {
    const lt = (t - 0.13) / 0.17;
    lateralFactor = 0.55 - lt * 0.20 + (rand(seed) - 0.5) * 0.15 * (1 - lt);
    apFactor = 0.55 + lt * 0.35;
    dorsalFactor = 0.25 + lt * 0.30 + (rand(seed + 2) - 0.5) * 0.2 * (1 - lt);
  } else if (t < 0.50) {
    const lt = (t - 0.30) / 0.20;
    lateralFactor = 0.35 - lt * 0.05;
    apFactor = 0.90 + lt * 0.50;
    dorsalFactor = 0.55 + (rand(seed + 2) - 0.5) * 0.06;
  } else if (t < 0.72) {
    const lt = (t - 0.50) / 0.22;
    lateralFactor = 0.30 - lt * 0.08;
    apFactor = 1.40 + lt * 0.25;
    dorsalFactor = 0.55 + lt * 0.05;
  } else {
    const lt = Math.min(1, (t - 0.72) / 0.28);
    lateralFactor = 0.22 - lt * 0.02;
    apFactor = 1.65 + lt * 0.15;
    dorsalFactor = 0.60 + lt * 0.03;
  }

  let posX = side * lateralFactor + (rand(seed + 3) - 0.5) * 0.025;
  let posY = dorsalFactor + (rand(seed + 4) - 0.5) * 0.02;
  let posZ = apNorm * apFactor + (rand(seed + 5) - 0.5) * 0.015;

  let perturbActive = false;
  if (scenario.ablationWindow) {
    const [wStart, wEnd] = scenario.ablationWindow;
    const dose = scenario.dose;
    const isStage1 = wStart < 0.25;

    let perturbStrength = 0;
    if (scenario.ablationMode === 'A') {
      if (t < wStart) perturbStrength = 0;
      else if (t <= wEnd) { perturbStrength = dose; perturbActive = true; }
      else perturbStrength = isStage1 ? dose * 0.35 : dose * 0.55;
    } else if (scenario.ablationMode === 'B') {
      if (t >= wStart) {
        perturbStrength = dose * 0.75;
        if (t <= Math.min(wStart + 0.14, wEnd)) perturbActive = true;
      }
    }

    if (perturbStrength > 0) {
      if (isStage1) {
        posX += (rand(seed + 10) - 0.5) * perturbStrength * 0.45;
        posY += (rand(seed + 11) - 0.5) * perturbStrength * 0.20;
        posZ += (rand(seed + 12) - 0.5) * perturbStrength * 0.55;
        if (perturbStrength > 0.6 && rand(seed + 13) < 0.18) {
          posX *= -0.6; posZ *= 0.85;
        }
      } else {
        posZ *= (1.0 - perturbStrength * 0.55);
        if (dose > 0.8) {
          posZ *= 0.6;
          posX *= (1.0 - perturbStrength * 0.15);
          posZ += (rand(seed + 14) - 0.5) * perturbStrength * 0.10;
          posX += (rand(seed + 15) - 0.5) * perturbStrength * 0.06;
        }
      }
      if (dose > 0.9 && scenario.ablationMode === 'B' && t > scenario.ablationWindow[0] + 0.15) {
        const chaos = perturbStrength * 0.7;
        posX += (rand(seed + 20) - 0.5) * chaos * 0.65;
        posY += (rand(seed + 21) - 0.5) * chaos * 0.35;
        posZ += (rand(seed + 22) - 0.5) * chaos * 0.85;
      }
    }
  }
  return { x: posX, y: posY, z: posZ, perturbActive };
}

// ============================================================
// PANEL CONSTRUCTION
// ============================================================
const panels = []; // { scenarioKey, scenario, scene, cells, bodyMesh, wireMesh, lights, headerEl, footerEl }

function makePanel(scenarioKey) {
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a0a, 0.025);

  scene.add(new THREE.AmbientLight(0x404040, 0.6));
  const k = new THREE.DirectionalLight(0xffffff, 0.9); k.position.set(5,5,5); scene.add(k);
  const f = new THREE.DirectionalLight(0x8899aa, 0.4); f.position.set(-3,2,-3); scene.add(f);
  const r = new THREE.DirectionalLight(0x4ECDC4, 0.35); r.position.set(0,-2,-5); scene.add(r);

  const bodyMesh = new THREE.Mesh(bodyGeometry, bodyMaterial);
  const wireMesh = new THREE.Mesh(bodyGeometry, wireMaterial);
  scene.add(bodyMesh); scene.add(wireMesh);

  const cells = new THREE.InstancedMesh(cellGeometry, cellMaterial, N_CELLS);
  cells.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  if (!cells.instanceColor) {
    const colorArr = new Float32Array(N_CELLS * 3);
    cells.instanceColor = new THREE.InstancedBufferAttribute(colorArr, 3);
  }
  scene.add(cells);

  return {
    scenarioKey,
    scenario: SCENARIOS[scenarioKey],
    scene,
    cells,
    bodyMesh, wireMesh,
    perturbActive: false,
  };
}

// ============================================================
// LAYOUT
// ============================================================
const HUD_H = 80;
const TIMELINE_H = 80;
const PANEL_HEADER_H = 60;
const PANEL_FOOTER_H = 80;
const PANEL_GAP = 6;

function getPanelRectCSS(i, N) {
  const w = window.innerWidth;
  const panelW = (w - (N + 1) * PANEL_GAP) / N;
  const x = PANEL_GAP + i * (panelW + PANEL_GAP);
  return { x, w: panelW };
}

function getPanelViewport(i, N) {
  const rect = getPanelRectCSS(i, N);
  const h = window.innerHeight;
  const y_webgl = TIMELINE_H + PANEL_FOOTER_H;
  const height = h - HUD_H - PANEL_HEADER_H - TIMELINE_H - PANEL_FOOTER_H;
  return { x: rect.x, y: y_webgl, w: rect.w, h: height };
}

// ============================================================
// OVERLAYS (per-panel HTML)
// ============================================================
const overlaysRoot = document.getElementById('panelOverlays');

function buildOverlays(N) {
  overlaysRoot.innerHTML = '';
  panels.forEach((p, i) => {
    const rect = getPanelRectCSS(i, N);

    // Header
    const header = document.createElement('div');
    header.className = 'panel-header';
    header.style.left = rect.x + 'px';
    header.style.width = rect.w + 'px';
    const stageClass = 's' + p.scenario.stage;
    const stageLabel = p.scenario.stage === 0 ? 'CONTROL' : p.scenario.stage === 1 ? 'ETAPA 1' : 'ETAPA 2';
    header.innerHTML = `
      <div class="panel-header-inner">
        <div class="panel-num">${i+1}</div>
        <select class="panel-select" data-panel="${i}"></select>
      </div>
      <span class="panel-stagepill ${stageClass}" data-pill="${i}">${stageLabel}</span>
    `;
    overlaysRoot.appendChild(header);

    // Populate select
    const select = header.querySelector('select');
    SCENARIO_ORDER.forEach(key => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = SCENARIOS[key].label;
      if (key === p.scenarioKey) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('change', (e) => {
      const newKey = e.target.value;
      p.scenarioKey = newKey;
      p.scenario = SCENARIOS[newKey];
      updatePanelOverlay(i);
      updateAblationMarkers();
    });

    // Footer
    const footer = document.createElement('div');
    footer.className = 'panel-footer';
    footer.style.left = rect.x + 'px';
    footer.style.width = rect.w + 'px';
    footer.innerHTML = `
      <div class="panel-footer-row">
        <div class="conf-pill" data-conf="${i}"></div>
        <div class="decouple-pill" data-decouple="${i}"></div>
        <div class="ablation-tag" data-ablation="${i}">ABL ↓0%</div>
      </div>
      <div class="pheno-text" data-pheno="${i}"></div>
    `;
    overlaysRoot.appendChild(footer);

    p.headerEl = header;
    p.footerEl = footer;
    updatePanelOverlay(i);
  });
}

function updatePanelOverlay(i) {
  const p = panels[i];
  const sc = p.scenario;

  // Stage pill
  const pill = p.headerEl.querySelector('.panel-stagepill');
  pill.className = 'panel-stagepill s' + sc.stage;
  pill.textContent = sc.stage === 0 ? 'CONTROL' : sc.stage === 1 ? 'ETAPA 1' : 'ETAPA 2';

  // Confidence
  const confEl = p.footerEl.querySelector('[data-conf]');
  let confColor;
  if (sc.confidence >= 0.75) confColor = '#7FB069';
  else if (sc.confidence >= 0.60) confColor = '#D4A442';
  else if (sc.confidence >= 0.99) confColor = '#4ECDC4';
  else confColor = '#B44D4D';
  if (sc.stage === 0) confColor = '#4ECDC4';
  confEl.style.color = confColor;
  confEl.style.borderColor = confColor + '66';
  confEl.style.background = confColor + '15';
  confEl.textContent = `conf ${sc.confidence.toFixed(2)}`;

  // Decouple
  const dEl = p.footerEl.querySelector('[data-decouple]');
  dEl.className = 'decouple-pill ' + sc.decouple;
  dEl.textContent = sc.decoupleLabel;

  // Phenotype
  p.footerEl.querySelector('[data-pheno]').textContent = sc.pheno;
}

function positionOverlays(N) {
  panels.forEach((p, i) => {
    const rect = getPanelRectCSS(i, N);
    p.headerEl.style.left = rect.x + 'px';
    p.headerEl.style.width = rect.w + 'px';
    p.footerEl.style.left = rect.x + 'px';
    p.footerEl.style.width = rect.w + 'px';
    p.footerEl.style.bottom = TIMELINE_H + 'px';
  });
}

// ============================================================
// LAYOUT SWITCHING
// ============================================================
let currentN = 3;

function setLayout(N) {
  currentN = N;
  // Adjust panels array
  while (panels.length < N) {
    const defaults = DEFAULT_SCENARIOS[N] || DEFAULT_SCENARIOS[3];
    const key = defaults[panels.length] || SCENARIO_ORDER[panels.length] || 'control';
    panels.push(makePanel(key));
  }
  while (panels.length > N) {
    const p = panels.pop();
    p.scene.clear();
  }

  // For N change, also reset to defaults? Keep current scenarios but ensure we have enough.
  // Currently if N grew from 2 to 4, we add 2 with defaults.

  // Rebuild overlays
  buildOverlays(N);
  positionOverlays(N);
  updateAblationMarkers();

  // Update button state
  document.querySelectorAll('.layout-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.n) === N);
  });
}

document.querySelectorAll('.layout-btn').forEach(btn => {
  btn.addEventListener('click', () => setLayout(parseInt(btn.dataset.n)));
});

// ============================================================
// ABLATION MARKERS ON TIMELINE
// ============================================================
const ablationMarkers = document.getElementById('ablationMarkers');

function updateAblationMarkers() {
  ablationMarkers.innerHTML = '';
  // Show union of all active scenarios' ablation windows, with light coloring per panel
  panels.forEach((p, i) => {
    const sc = p.scenario;
    if (!sc.ablationWindow) return;
    const [s, e] = sc.ablationWindow;

    // Band
    const band = document.createElement('div');
    band.className = 'am-marker am-band';
    band.style.left = (s * 100) + '%';
    band.style.width = ((e - s) * 100) + '%';
    band.style.top = (i * 3) + 'px';
    band.style.height = '3px';
    band.style.opacity = sc.ablationMode === 'A' ? '0.8' : '0.5';
    ablationMarkers.appendChild(band);
  });
}

// ============================================================
// STAGE DOTS IN HUD
// ============================================================
const stageDots = document.getElementById('stageDots');
STAGES.forEach(() => {
  const d = document.createElement('div');
  d.className = 'stage-dot';
  stageDots.appendChild(d);
});
function updateStageDots(idx) {
  stageDots.querySelectorAll('.stage-dot').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
    d.classList.toggle('done', i < idx);
  });
}

// ============================================================
// TIMELINE
// ============================================================
const TOTAL_FRAMES = 480;
let currentFrame = 0;
let playing = true;
const timelineBar = document.getElementById('timelineBar');
const timelineFill = document.getElementById('timelineFill');

let dragging = false;
timelineBar.addEventListener('mousedown', (e) => {
  dragging = true; playing = false;
  document.getElementById('btnPlay').textContent = '▶ PLAY';
  seekTimeline(e);
});
document.addEventListener('mousemove', (e) => { if (dragging) seekTimeline(e); });
document.addEventListener('mouseup', () => { dragging = false; });
function seekTimeline(e) {
  const rect = timelineBar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  currentFrame = Math.floor(pct * TOTAL_FRAMES);
}

document.getElementById('btnPlay').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('btnPlay').textContent = playing ? '❚❚ PAUSE' : '▶ PLAY';
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    playing = !playing;
    document.getElementById('btnPlay').textContent = playing ? '❚❚ PAUSE' : '▶ PLAY';
    e.preventDefault();
  }
  if (e.code === 'ArrowRight') currentFrame = Math.min(currentFrame + 10, TOTAL_FRAMES - 1);
  if (e.code === 'ArrowLeft')  currentFrame = Math.max(currentFrame - 10, 0);
  if (e.code === 'KeyR') currentFrame = 0;
});

// ============================================================
// CELL UPDATE
// ============================================================
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

function updateCells(panel, t) {
  const baseColor = fateColor(t);
  let anyPerturb = false;
  for (let i = 0; i < N_CELLS; i++) {
    const state = computeCellPosition(i, t, panel.scenario);
    if (state.perturbActive) anyPerturb = true;
    dummy.position.set(state.x, state.y, state.z);
    let scl = 1.0;
    if (t < 0.13) scl = 0.7;
    else if (t > 0.72) scl = 1.05;
    dummy.scale.setScalar(scl);
    dummy.updateMatrix();
    panel.cells.setMatrixAt(i, dummy.matrix);
    if (state.perturbActive) tmpColor.copy(baseColor).lerp(COL_PERTURB, 0.45);
    else tmpColor.copy(baseColor);
    panel.cells.setColorAt(i, tmpColor);
  }
  panel.cells.instanceMatrix.needsUpdate = true;
  if (panel.cells.instanceColor) panel.cells.instanceColor.needsUpdate = true;
  panel.perturbActive = anyPerturb;
}

// ============================================================
// RENDER LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  if (playing) currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
  const t = currentFrame / TOTAL_FRAMES;

  deformBody(t);

  panels.forEach(p => updateCells(p, t));

  // HUD updates
  const stage = getStage(t);
  document.getElementById('hudTime').textContent = `${tToHpf(t)} hpf`;
  document.getElementById('hudStage').textContent = stage.name;
  document.getElementById('timeValue').textContent = t.toFixed(2);
  document.getElementById('timelineStage').textContent = `${stage.name} · ${stage.hpf}`;
  timelineFill.style.width = (t * 100) + '%';
  updateStageDots(stage.index);

  // Per-panel ablation tag
  panels.forEach((p, i) => {
    const tag = p.footerEl.querySelector('[data-ablation]');
    if (p.perturbActive) {
      const dosePct = Math.round(p.scenario.dose * 100);
      tag.textContent = `ABL ↓${dosePct}% ${p.scenario.ablationMode === 'A' ? '· SS' : '· PERS'}`;
      tag.classList.add('active');
    } else {
      tag.classList.remove('active');
    }
  });

  // Render each viewport
  controls.update();
  renderer.clear();
  panels.forEach((p, i) => {
    const vp = getPanelViewport(i, currentN);
    renderer.setViewport(vp.x, vp.y, vp.w, vp.h);
    renderer.setScissor(vp.x, vp.y, vp.w, vp.h);
    renderer.setScissorTest(true);
    camera.aspect = vp.w / vp.h;
    camera.updateProjectionMatrix();
    renderer.render(p.scene, camera);
  });
  renderer.setScissorTest(false);
}

// ============================================================
// INIT
// ============================================================
setLayout(3);
animate();

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  positionOverlays(currentN);
});
</script>
</body>
</html>
