# DATA INAMOVIBLE — self-hosted Neo4j (graph + native vector index) for the rack (ADR-0020).
# Neo4j 5.x has a built-in HNSW vector index (db.index.vector.*) — no extra vector DB needed.
# NO paid services. Run on the rack:  docker compose -f docker-compose.neo4j.yml up -d
# Set NEO4J_AUTH password via an .env file or env (NEVER commit secrets — CLAUDE.md §7).
services:
  neo4j:
    image: neo4j:5.23-community            # Community Edition = free (GPLv3); pin the version
    container_name: data-inamovible-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"                        # HTTP / Neo4j Browser
      - "7687:7687"                        # Bolt (the agents' driver port)
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/please-change-me}   # override via .env; do not commit a real secret
      - NEO4J_PLUGINS=["apoc"]             # APOC for graph utilities (graphify ingestion)
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_max__size=4G              # tune to the rack
      - NEO4J_server_memory_pagecache_size=2G
    volumes:
      - neo4j_data:/data                   # persistent graph + vector index (the DATA INAMOVIBLE store)
      - neo4j_logs:/logs
      - ./import:/import                   # drop graphify-produced Cypher/CSV here for ingestion
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Optional: a self-hosted embedding service (Ollama) for general embeddings (bge/nomic).
  # SPECTER2/BioBERT (papers) run via a small transformers/ONNX service or a batch job at ingestion.
  ollama:
    image: ollama/ollama:latest
    container_name: data-inamovible-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_models:
