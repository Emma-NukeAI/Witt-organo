# Webapp read-only query service on Dokploy (block 2, ADR-0048). Same deploy pattern as the ingest
# service: Dokploy -> Compose -> this repo, compose path rag_index/query_service/docker-compose.query.yml
# (build context = repo root). Secrets go in the Dokploy Environment tab — NEVER committed (§7).
#
# NETWORKING (ADR-0047 decision 5): NO published ports — this service is INTERNAL-ONLY; the webapp will
# be the single exposed surface. It joins: the Neo4j stack's network (semantic queries), the MinIO stack's
# network (raw drill), and dokploy-network (where the native Postgres `rag-wittbackenddb-qxzrgu` lives).
# Verification happens from the service's own terminal in Dokploy (curl-less python one-liners — README).
services:
  query:
    build:
      context: ../..                                   # repo root (Dockerfile copies the whole repo)
      dockerfile: rag_index/query_service/Dockerfile
    restart: unless-stopped
    networks: [default, neo4j_net, minio_net, dokploy-network]
    environment:
      - NEO4J_URI=${NEO4J_URI}                         # bolt://data-inamovible-neo4j:7687 (nombre INTERNO;
                                                       # la IP publica del host NO es alcanzable desde este
                                                       # contenedor — hairpin timeout, verificado 2026-08-10)
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - RAG_BACKEND=neo4j
      - EMBED_MODEL=openai                             # the ADR-0039 hard pin (1536-dim index)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}               # raw drill (/raw) presigning
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - WITT_BACKEND_DB_URL=${WITT_BACKEND_DB_URL}     # postgresql+psycopg://witt:...@rag-wittbackenddb-qxzrgu:5432/witt
      - DI_QUERY_POOL_SIZE=8                           # 5 users (the hardcoded 4 queued the 5th)
      - WITT_CORS_ORIGINS=${WITT_CORS_ORIGINS:-}       # set to the webapp origin when it exists
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}         # block 3 (ADR-0050): synthesis (opus) + panel
      - WITT_RUN_WORKERS=${WITT_RUN_WORKERS:-2}        # in-process run workers (runs take minutes)
      # ADR-0078 — Path A/B hygiene. Placeholders only: values live in the Dokploy Environment tab; the
      # defaults are DECLARED in code (answer_pipeline / pubmed_literature / fetch_paper / runs) and the
      # effective value + its provenance ('env:…' | 'default-unset:…' | 'default-invalid-env:…') travel in
      # every bundle + ledger. An EMPTY value is tolerated everywhere (declared default, never a crash).
      - WITT_NCBI_EMAIL=${WITT_NCBI_EMAIL:-}           # NCBI E-utilities `email=` + fetch UA contact; empty
                                                       # => ncbi_identity 'missing' / contact 'unset' (declared, never invented)
      - NCBI_API_KEY=${NCBI_API_KEY:-}                 # optional; raises NCBI limit (derives 0.10 s pacing)
      - WITT_NCBI_MIN_INTERVAL_S=${WITT_NCBI_MIN_INTERVAL_S:-}   # empty => derived (0.34 s no key / 0.10 s key)
      - WITT_EPMC_MIN_INTERVAL_S=${WITT_EPMC_MIN_INTERVAL_S:-0.2}
      - WITT_PATH_A_CHARS=${WITT_PATH_A_CHARS:-2400}   # chars per Path-A hit handed to the synthesizer (was 140)
      - WITT_PATH_B_N_PAPERS=${WITT_PATH_B_N_PAPERS:-5}          # literature papers selected (top-n)
      - WITT_PATH_B_RETMAX=${WITT_PATH_B_RETMAX:-20}   # candidates requested from EACH literature source
      - WITT_PATH_B_EXCERPT_CHARS=${WITT_PATH_B_EXCERPT_CHARS:-1500}
      - WITT_CACHE_TTL_DAYS=${WITT_CACHE_TTL_DAYS:-7}  # read-cache window for raw_paper_*.json (declared cache_hit)
      - WITT_REAP_STALE_S=${WITT_REAP_STALE_S:-900}    # running run with no heartbeat for >N s => failed 'worker-lost'
      - WITT_ZFIN_SERVER_FILTER=${WITT_ZFIN_SERVER_FILTER:-0}   # 1 = one filter.termName GET per anatomy root at Alliance
                                                       # (unmeasured live; 'a|b' measured HTTP 400 2026-09-14) — default: client filter
    healthcheck:                                       # process-liveness only: no auth, no network, no spend
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8078/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s                                # lifespan preloads sklearn + warms dense before serving
networks:
  default: {}
  neo4j_net:
    external: true
    name: rag-emma-mequsz_default                      # the Neo4j stack's network (same as the ingest service)
  minio_net:
    external: true
    name: rag-datainamovibleminio-grjoil_default       # the MinIO stack's network
  dokploy-network:
    external: true
    name: dokploy-network                              # where the native Dokploy Postgres lives
