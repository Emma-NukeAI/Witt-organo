# Webapp read-only query service on Dokploy (block 2, ADR-0048). Same deploy pattern as the ingest
# service: Dokploy -> Compose -> this repo, compose path rag_index/query_service/docker-compose.query.yml
# (build context = repo root). Secrets go in the Dokploy Environment tab — NEVER committed (§7).
#
# NETWORKING (ADR-0047 decision 5): NO published ports — this service is INTERNAL-ONLY; the webapp will
# be the single exposed surface. It joins: the Neo4j stack's network (semantic queries), the MinIO stack's
# network (raw drill), and dokploy-network (where the native Postgres `rag-wittbackenddb-qxzrgu` lives).
# Verification happens from the service's own terminal in Dokploy (curl-less python one-liners — README).
services:
  query:
    build:
      context: ../..                                   # repo root (Dockerfile copies the whole repo)
      dockerfile: rag_index/query_service/Dockerfile
    restart: unless-stopped
    networks: [default, neo4j_net, minio_net, dokploy-network]
    environment:
      - NEO4J_URI=${NEO4J_URI}                         # bolt://data-inamovible-neo4j:7687 (nombre INTERNO;
                                                       # la IP publica del host NO es alcanzable desde este
                                                       # contenedor — hairpin timeout, verificado 2026-08-10)
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - RAG_BACKEND=neo4j
      - EMBED_MODEL=openai                             # the ADR-0039 hard pin (1536-dim index)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}               # raw drill (/raw) presigning
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - WITT_BACKEND_DB_URL=${WITT_BACKEND_DB_URL}     # postgresql+psycopg://witt:...@rag-wittbackenddb-qxzrgu:5432/witt
      - DI_QUERY_POOL_SIZE=8                           # 5 users (the hardcoded 4 queued the 5th)
      - WITT_CORS_ORIGINS=${WITT_CORS_ORIGINS:-}       # set to the webapp origin when it exists
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}         # block 3 (ADR-0050): synthesis (opus) + panel
      - WITT_RUN_WORKERS=${WITT_RUN_WORKERS:-2}        # in-process run workers (runs take minutes)
      # ADR-0078 — Path A/B hygiene. Placeholders only: values live in the Dokploy Environment tab; the
      # defaults are DECLARED in code (answer_pipeline / pubmed_literature / fetch_paper / runs) and the
      # effective value + its provenance ('env:…' | 'default-unset:…' | 'default-invalid-env:…') travel in
      # every bundle + ledger. An EMPTY value is tolerated everywhere (declared default, never a crash).
      - WITT_NCBI_EMAIL=${WITT_NCBI_EMAIL:-}           # NCBI E-utilities `email=` + fetch UA contact; empty
                                                       # => ncbi_identity 'missing' / contact 'unset' (declared, never invented)
      - NCBI_API_KEY=${NCBI_API_KEY:-}                 # optional; raises NCBI limit (derives 0.10 s pacing)
      - WITT_NCBI_MIN_INTERVAL_S=${WITT_NCBI_MIN_INTERVAL_S:-}   # empty => derived (0.34 s no key / 0.10 s key)
      - WITT_EPMC_MIN_INTERVAL_S=${WITT_EPMC_MIN_INTERVAL_S:-0.2}
      - WITT_PATH_A_CHARS=${WITT_PATH_A_CHARS:-2400}   # chars per Path-A hit handed to the synthesizer (was 140)
      - WITT_PATH_B_N_PAPERS=${WITT_PATH_B_N_PAPERS:-5}          # literature papers selected (top-n)
      - WITT_PATH_B_RETMAX=${WITT_PATH_B_RETMAX:-20}   # candidates requested from EACH literature source
      - WITT_PATH_B_EXCERPT_CHARS=${WITT_PATH_B_EXCERPT_CHARS:-1500}
      - WITT_CACHE_TTL_DAYS=${WITT_CACHE_TTL_DAYS:-7}  # read-cache window for raw_paper_*.json (declared cache_hit)
      - WITT_REAP_STALE_S=${WITT_REAP_STALE_S:-900}    # running run with no heartbeat for >N s => failed 'worker-lost'
      - WITT_ZFIN_SERVER_FILTER=${WITT_ZFIN_SERVER_FILTER:-0}   # 1 = one filter.termName GET per anatomy root at Alliance
                                                       # (unmeasured live; 'a|b' measured HTTP 400 2026-09-14) — default: client filter
      # ADR-0079 — la investigación (turnos encadenados sobre una raíz) y el ORIGEN de cada corrida. Placeholders
      # only: defaults DECLARED in code (runs.py / app.py); the effective value + its provenance travel in the
      # record (frozen.origin.source, thread_context.human_comments.limits, kill_switch). EMPTY = declared default.
      - WITT_RUN_ORIGIN=${WITT_RUN_ORIGIN:-}           # enum production|dev-offline|replay|smoke|simulation|fixture. EMPTY =>
                                                       # derived: 'production' (source default:production) unless
                                                       # WITT_ALLOW_RUNS_OFFLINE=1 (dev-offline). Only 'production' counts as
                                                       # precedent/calibration by default; outside the enum => 'invalid-env:<v>'
                                                       # DECLARED (the run is still created). Rows older than the column stay NULL.
      - WITT_THREAD_CONTEXT=${WITT_THREAD_CONTEXT:-1}  # 0 = kill-switch: thread columns are filled, the previous-turn snapshot
                                                       # is NOT built/delivered to the model (skipped_reason declared)
      - WITT_THREAD_COMMENTS_MAX=${WITT_THREAD_COMMENTS_MAX:-8}       # parent comments carried in the snapshot (truncated declared)
      - WITT_THREAD_COMMENTS_CHARS=${WITT_THREAD_COMMENTS_CHARS:-8000}   # TOTAL chars of those comments
      - WITT_THREAD_ANSWER_CHARS=${WITT_THREAD_ANSWER_CHARS:-1200}     # chars of the parent's direct_answer in the snapshot
      - WITT_PIVOT_TURNS=${WITT_PIVOT_TURNS:-3}         # GET /threads: consecutive flat turns (gap_flags not reduced) => pivot_suggested
      # ADR-0080 — competence gate + search harness. Placeholders only: defaults DECLARED in code (competence.py /
      # runs.py / lib/search_harness.py / composite_auditor.py / .tooluniverse/tools); the effective value + its
      # provenance ('env:…' | 'default-unset:…' | 'default-invalid-env:…') travel in frozen.competence.config,
      # frozen.search_ledger.config_source and audit.judge_retries. EMPTY = declared default, never a crash.
      - WITT_COMPETENCE_GATE=${WITT_COMPETENCE_GATE:-1}          # 0 = kill-switch: competent null + skipped_reason; the legacy
                                                                 # `pass1 < tau` rule (ADR-0051) decides the route again and Path B runs
                                                                 # WITHOUT the harness (fallback.trigger 'confidence', ADR-0078 path byte for byte)
      - WITT_CG_REQUIRE_CALIBRATION=${WITT_CG_REQUIRE_CALIBRATION:-0}   # 1 = calibration_coverage.sufficient joins the conjunction
      - WITT_CG_CONF_COMPONENT=${WITT_CG_CONF_COMPONENT:-1}       # 1 (default, cg-3) = the elicited confidence (CONF_TOOL, ADR-0065; conf1 >= tau)
                                                                 # GATES in the conjunction as ADR-0051 decided; 0 = measured and declared only
                                                                 # (informative, outside the conjunction). cg-2's default 0 was reverted 2026-09-15:
                                                                 # it let conf1 0.15 + structural sufficiency skip Path B (case a361f566, ADR-0059)
      - WITT_CG_CALIBRATION_ORIGINS=${WITT_CG_CALIBRATION_ORIGINS:-production}   # run origins counted as calibration history (CSV; 'all' = no filter)
      - WITT_COMPETENCE_MIN_HISTORY=${WITT_COMPETENCE_MIN_HISTORY:-10}  # CLOSED+rated runs intersecting the plan's niches for 'sufficient'
      - WITT_FALLBACK_CONF_TAU=${WITT_FALLBACK_CONF_TAU:-0.5}     # tau of conf1_ge_tau and of the legacy rule (tolerant reader: empty => 0.5)
      - WITT_SEARCH_HARNESS=${WITT_SEARCH_HARNESS:-1}             # 0 = the gate still decides, but Path B runs by path_b_bundle WITHOUT a plan
                                                                 # (no Layer 0 families, no rounds) — the operator's brake if a tool misbehaves
      - WITT_SEARCH_ROUNDS_CAP=${WITT_SEARCH_ROUNDS_CAP:-2}       # max harness rounds per run (a 2nd round only for families whose INPUTS changed;
                                                                 # identical inputs are never re-executed: stop_reason 'no-new-inputs')
      - WITT_SEARCH_ROUND_BUDGET_S=${WITT_SEARCH_ROUND_BUDGET_S:-120}   # wall-clock budget per ROUND (shared across families; skipped-budget declared)
      - WITT_SEARCH_DEFAULT_FAMILIES=${WITT_SEARCH_DEFAULT_FAMILIES:-}  # empty => europepmc,pubmed,zfin,alliance_orthologs,zfin_expression;
                                                                 # naming a 'directive-only' family here IS the operator's directive
      - WITT_JUDGE_RETRIES=${WITT_JUDGE_RETRIES:-1}               # additional attempts per errored/unparseable judge (declared per row)
      - WITT_MCP_CACHE_DIR=${WITT_MCP_CACHE_DIR:-}               # per-day read cache of the Layer 0 tools; empty => <repo>/mcp_cache
                                                                 # (needs WRITE permission in the container: the ZFIN expression TSV is ~44 MB)
      - OPENALEX_API_KEY=${OPENALEX_API_KEY:-}                   # optional; without it OpenAlex bills credits (~10/call, 1000/day measured 2026-09-15)
      - WITT_UNPAYWALL_EMAIL=${WITT_UNPAYWALL_EMAIL:-}           # REQUIRED by Unpaywall; empty => that source row is 'tool-unavailable' (declared)
      - WITT_ENSEMBL_MIN_INTERVAL_S=${WITT_ENSEMBL_MIN_INTERVAL_S:-0.07}      # rest.ensembl.org pacing (15 req/s documented)
      - WITT_ZFIN_EXPR_DOWNLOAD_BUDGET_S=${WITT_ZFIN_EXPR_DOWNLOAD_BUDGET_S:-180}   # once-a-day TSV download budget (43.7 MB measured, 27 s)
      - WITT_ZFIN_EXPR_MAX_MB=${WITT_ZFIN_EXPR_MAX_MB:-500}       # hard cap on that download
      - WITT_ZFIN_EXPR_SCAN_BUDGET_S=${WITT_ZFIN_EXPR_SCAN_BUDGET_S:-60}     # local scan budget of the cached TSV (243k lines, 0.5 s measured)
      - WITT_GEO_RETMAX=${WITT_GEO_RETMAX:-10}                   # GEO DataSets uids per esearch (clamp 1..500)
      # WITT_GEO_ORGANISM is deliberately NOT declared here: geo_gds treats a PRESENT-but-empty value as "disable the
      # [Organism] block" (declared organism_sent null); unset => 'Danio rerio'. Set it in Dokploy only when you mean it.
      - WITT_OPENALEX_PER_PAGE=${WITT_OPENALEX_PER_PAGE:-5}      # OpenAlex works per call (clamp 1..200)
      # ADR-0081 — política best-tier v2 y generación de modelos g2-2026-09. SÓLO placeholders: los defaults viven
      # DECLARADOS en analysis/scripts/lib/models.py (ENV_TABLE) y el valor efectivo + su fuente ('env:…' |
      # 'default-unset:…' | 'default-invalid-env:…') viajan en frozen.models, stage.models, audit.quorum y
      # /config-history.current. VACÍA = default declarado, jamás un crash. TODA ENV IMPLICA REINICIO: el os.environ
      # del contenedor se fija al arrancar el proceso — cambiar un valor en Dokploy NO surte efecto hasta
      # redeploy/restart (ADR-0081 Context 10); el ledger config_history registra el diff al arrancar
      # (changed_by 'system:boot-diff'). WITT_JUDGE_RETRIES (arriba, ADR-0080) entra al snapshot sin cambio.
      - WITT_MODEL_GENERATION=${WITT_MODEL_GENERATION:-g2-2026-09}   # generación de defaults y TOPES por rol; g1-2026-08 = f57a3d3 byte a byte (kill-switch)
      - WITT_MODEL_SYNTH=${WITT_MODEL_SYNTH:-}                       # sintetizador; vacía => default de la generación (claude-opus-5 en g2)
      - WITT_MODEL_PLANNER=${WITT_MODEL_PLANNER:-}                   # planner (POST /runs/plan); vacía => idem
      - WITT_MODEL_ELICIT=${WITT_MODEL_ELICIT:-}                     # elicitación de confianza (CONF_TOOL, ADR-0065); vacía => idem
      - WITT_MODEL_QUESTION=${WITT_MODEL_QUESTION:-}                 # agente de preguntas (question_agent); vacía => idem
      - WITT_JUDGE_CORRECTNESS=${WITT_JUDGE_CORRECTNESS:-}           # asiento correctness (anthropic); vacía => claude-opus-5 (g2) / claude-opus-4-8 (g1)
      - WITT_JUDGE_OVERCLAIM=${WITT_JUDGE_OVERCLAIM:-}               # asiento overclaim (anthropic); vacía => claude-sonnet-5
      - WITT_JUDGE_GROUNDING=${WITT_JUDGE_GROUNDING:-}               # asiento evidence-grounding (anthropic); vacía => claude-haiku-4-5-20251001, que se
                                                                     # retira >= 2026-10-15: el sucesor declarado claude-sonnet-5 se fija AQUÍ (ADR-0081 (E))
      - OPENAI_JUDGE_MODEL=${OPENAI_JUDGE_MODEL:-}                   # asiento reproducibility (openai; ya existía); vacía => gpt-4o; gpt-6-astra SÓLO tras LG3 (E1)
      - WITT_PANEL_AUTO_RETIRE=${WITT_PANEL_AUTO_RETIRE:-0}          # 1 = sucesor automático al llegar retire_not_before (declarado + fila runtime-diff); 0 = manual (E2)
      - WITT_PANEL_MIN_FAMILIES=${WITT_PANEL_MIN_FAMILIES:-2}        # cuórum de FAMILIAS con veredicto válido; 0|1 = kill-switch (gating false = regla de hoy)
      - WITT_PANEL_MIN_LENSES=${WITT_PANEL_MIN_LENSES:-3}            # cuórum de LENTES con veredicto válido; 0|1 = kill-switch
      - WITT_OPENAI_API=${WITT_OPENAI_API:-table}                    # table (la api de la tabla por modelo) | responses (fuerza Responses) | chat-completions (caller de hoy)
      - WITT_OPENAI_STORE=${WITT_OPENAI_STORE:-0}                    # `store` de responses.create (el default de la API es true = retención 30 días del lado OpenAI)
      - WITT_OPENAI_MAX_OUTPUT_TOKENS=${WITT_OPENAI_MAX_OUTPUT_TOKENS:-4000}   # TOPE (no gasto) del camino Responses; el camino chat conserva 1200
      - WITT_OPENAI_REASONING_EFFORT=${WITT_OPENAI_REASONING_EFFORT:-}        # low|medium|high; vacía = no se envía; sólo a modelos con reasoning True en la tabla
      - WITT_OPENAI_TIMEOUT_S=${WITT_OPENAI_TIMEOUT_S:-120}          # timeout por llamada del juez OpenAI; regla (1+WITT_JUDGE_RETRIES)×timeout×2 <= WITT_REAP_STALE_S
      - WITT_ANTHROPIC_EFFORT=${WITT_ANTHROPIC_EFFORT:-}             # output_config.effort (low|medium|high|xhigh|max) SÓLO a modelos thinking_default 'adaptive'; vacía = default de la API
      - WITT_ANTHROPIC_EFFORT_ELICIT=${WITT_ANTHROPIC_EFFORT_ELICIT:-}   # override sólo para CONF_TOOL (la mini-llamada de confianza); vacía = hereda WITT_ANTHROPIC_EFFORT
      - WITT_CONFIG_LEDGER=${WITT_CONFIG_LEDGER:-1}                  # 0 = cero escrituras en la tabla config_history (ledger_state lo dice); el archivo atestiguado no cambia
    healthcheck:                                       # process-liveness only: no auth, no network, no spend
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8078/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s                                # lifespan preloads sklearn + warms dense before serving
networks:
  default: {}
  neo4j_net:
    external: true
    name: rag-emma-mequsz_default                      # the Neo4j stack's network (same as the ingest service)
  minio_net:
    external: true
    name: rag-datainamovibleminio-grjoil_default       # the MinIO stack's network
  dokploy-network:
    external: true
    name: dokploy-network                              # where the native Dokploy Postgres lives
