# Webapp read-only query service on Dokploy (block 2, ADR-0048). Same deploy pattern as the ingest
# service: Dokploy -> Compose -> this repo, compose path rag_index/query_service/docker-compose.query.yml
# (build context = repo root). Secrets go in the Dokploy Environment tab — NEVER committed (§7).
#
# NETWORKING (ADR-0047 decision 5): NO published ports — this service is INTERNAL-ONLY; the webapp will
# be the single exposed surface. It joins: the Neo4j stack's network (semantic queries), the MinIO stack's
# network (raw drill), and dokploy-network (where the native Postgres `rag-wittbackenddb-qxzrgu` lives).
# Verification happens from the service's own terminal in Dokploy (curl-less python one-liners — README).
services:
  query:
    build:
      context: ../..                                   # repo root (Dockerfile copies the whole repo)
      dockerfile: rag_index/query_service/Dockerfile
    restart: unless-stopped
    networks: [default, neo4j_net, minio_net, dokploy-network]
    environment:
      - NEO4J_URI=${NEO4J_URI}                         # bolt://data-inamovible-neo4j:7687 (nombre INTERNO;
                                                       # la IP publica del host NO es alcanzable desde este
                                                       # contenedor — hairpin timeout, verificado 2026-08-10)
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - RAG_BACKEND=neo4j
      - EMBED_MODEL=openai                             # the ADR-0039 hard pin (1536-dim index)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}               # raw drill (/raw) presigning
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - WITT_BACKEND_DB_URL=${WITT_BACKEND_DB_URL}     # postgresql+psycopg://witt:...@rag-wittbackenddb-qxzrgu:5432/witt
      - DI_QUERY_POOL_SIZE=8                           # 5 users (the hardcoded 4 queued the 5th)
      - WITT_CORS_ORIGINS=${WITT_CORS_ORIGINS:-}       # set to the webapp origin when it exists
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}         # block 3 (ADR-0050): synthesis (opus) + panel
      - WITT_RUN_WORKERS=${WITT_RUN_WORKERS:-2}        # in-process run workers (runs take minutes)
      # ADR-0078 — Path A/B hygiene. Placeholders only: values live in the Dokploy Environment tab; the
      # defaults are DECLARED in code (answer_pipeline / pubmed_literature / fetch_paper / runs) and the
      # effective value + its provenance ('env:…' | 'default-unset:…' | 'default-invalid-env:…') travel in
      # every bundle + ledger. An EMPTY value is tolerated everywhere (declared default, never a crash).
      - WITT_NCBI_EMAIL=${WITT_NCBI_EMAIL:-}           # NCBI E-utilities `email=` + fetch UA contact; empty
                                                       # => ncbi_identity 'missing' / contact 'unset' (declared, never invented)
      - NCBI_API_KEY=${NCBI_API_KEY:-}                 # optional; raises NCBI limit (derives 0.10 s pacing)
      - WITT_NCBI_MIN_INTERVAL_S=${WITT_NCBI_MIN_INTERVAL_S:-}   # empty => derived (0.34 s no key / 0.10 s key)
      - WITT_EPMC_MIN_INTERVAL_S=${WITT_EPMC_MIN_INTERVAL_S:-0.2}
      - WITT_PATH_A_CHARS=${WITT_PATH_A_CHARS:-2400}   # chars per Path-A hit handed to the synthesizer (was 140)
      - WITT_PATH_B_N_PAPERS=${WITT_PATH_B_N_PAPERS:-5}          # literature papers selected (top-n)
      - WITT_PATH_B_RETMAX=${WITT_PATH_B_RETMAX:-20}   # candidates requested from EACH literature source
      - WITT_PATH_B_EXCERPT_CHARS=${WITT_PATH_B_EXCERPT_CHARS:-1500}
      - WITT_CACHE_TTL_DAYS=${WITT_CACHE_TTL_DAYS:-7}  # read-cache window for raw_paper_*.json (declared cache_hit)
      - WITT_REAP_STALE_S=${WITT_REAP_STALE_S:-900}    # running run with no heartbeat for >N s => failed 'worker-lost'
      - WITT_ZFIN_SERVER_FILTER=${WITT_ZFIN_SERVER_FILTER:-0}   # 1 = one filter.termName GET per anatomy root at Alliance
                                                       # (unmeasured live; 'a|b' measured HTTP 400 2026-09-14) — default: client filter
      # ADR-0079 — la investigación (turnos encadenados sobre una raíz) y el ORIGEN de cada corrida. Placeholders
      # only: defaults DECLARED in code (runs.py / app.py); the effective value + its provenance travel in the
      # record (frozen.origin.source, thread_context.human_comments.limits, kill_switch). EMPTY = declared default.
      - WITT_RUN_ORIGIN=${WITT_RUN_ORIGIN:-}           # enum production|dev-offline|replay|smoke|simulation|fixture. EMPTY =>
                                                       # derived: 'production' (source default:production) unless
                                                       # WITT_ALLOW_RUNS_OFFLINE=1 (dev-offline). Only 'production' counts as
                                                       # precedent/calibration by default; outside the enum => 'invalid-env:<v>'
                                                       # DECLARED (the run is still created). Rows older than the column stay NULL.
      - WITT_THREAD_CONTEXT=${WITT_THREAD_CONTEXT:-1}  # 0 = kill-switch: thread columns are filled, the previous-turn snapshot
                                                       # is NOT built/delivered to the model (skipped_reason declared)
      - WITT_THREAD_COMMENTS_MAX=${WITT_THREAD_COMMENTS_MAX:-8}       # parent comments carried in the snapshot (truncated declared)
      - WITT_THREAD_COMMENTS_CHARS=${WITT_THREAD_COMMENTS_CHARS:-8000}   # TOTAL chars of those comments
      - WITT_THREAD_ANSWER_CHARS=${WITT_THREAD_ANSWER_CHARS:-1200}     # chars of the parent's direct_answer in the snapshot
      - WITT_PIVOT_TURNS=${WITT_PIVOT_TURNS:-3}         # GET /threads: consecutive flat turns (gap_flags not reduced) => pivot_suggested
      # ADR-0080 — competence gate + search harness. Placeholders only: defaults DECLARED in code (competence.py /
      # runs.py / lib/search_harness.py / composite_auditor.py / .tooluniverse/tools); the effective value + its
      # provenance ('env:…' | 'default-unset:…' | 'default-invalid-env:…') travel in frozen.competence.config,
      # frozen.search_ledger.config_source and audit.judge_retries. EMPTY = declared default, never a crash.
      - WITT_COMPETENCE_GATE=${WITT_COMPETENCE_GATE:-1}          # 0 = kill-switch: competent null + skipped_reason; the legacy
                                                                 # `pass1 < tau` rule (ADR-0051) decides the route again and Path B runs
                                                                 # WITHOUT the harness (fallback.trigger 'confidence', ADR-0078 path byte for byte)
      - WITT_CG_REQUIRE_CALIBRATION=${WITT_CG_REQUIRE_CALIBRATION:-0}   # 1 = calibration_coverage.sufficient joins the conjunction
      - WITT_CG_CONF_COMPONENT=${WITT_CG_CONF_COMPONENT:-1}       # 1 (default, cg-3) = the elicited confidence (CONF_TOOL, ADR-0065; conf1 >= tau)
                                                                 # GATES in the conjunction as ADR-0051 decided; 0 = measured and declared only
                                                                 # (informative, outside the conjunction). cg-2's default 0 was reverted 2026-09-15:
                                                                 # it let conf1 0.15 + structural sufficiency skip Path B (case a361f566, ADR-0059)
      - WITT_CG_CALIBRATION_ORIGINS=${WITT_CG_CALIBRATION_ORIGINS:-production}   # run origins counted as calibration history (CSV; 'all' = no filter)
      - WITT_COMPETENCE_MIN_HISTORY=${WITT_COMPETENCE_MIN_HISTORY:-10}  # CLOSED+rated runs intersecting the plan's niches for 'sufficient'
      - WITT_FALLBACK_CONF_TAU=${WITT_FALLBACK_CONF_TAU:-0.5}     # tau of conf1_ge_tau and of the legacy rule (tolerant reader: empty => 0.5)
      - WITT_SEARCH_HARNESS=${WITT_SEARCH_HARNESS:-1}             # 0 = the gate still decides, but Path B runs by path_b_bundle WITHOUT a plan
                                                                 # (no Layer 0 families, no rounds) — the operator's brake if a tool misbehaves
      - WITT_SEARCH_ROUNDS_CAP=${WITT_SEARCH_ROUNDS_CAP:-2}       # max harness rounds per run (a 2nd round only for families whose INPUTS changed;
                                                                 # identical inputs are never re-executed: stop_reason 'no-new-inputs')
      - WITT_SEARCH_ROUND_BUDGET_S=${WITT_SEARCH_ROUND_BUDGET_S:-120}   # wall-clock budget per ROUND (shared across families; skipped-budget declared)
      - WITT_SEARCH_DEFAULT_FAMILIES=${WITT_SEARCH_DEFAULT_FAMILIES:-}  # empty => europepmc,pubmed,zfin,alliance_orthologs,zfin_expression;
                                                                 # naming a 'directive-only' family here IS the operator's directive
      - WITT_JUDGE_RETRIES=${WITT_JUDGE_RETRIES:-1}               # additional attempts per errored/unparseable judge (declared per row)
      - WITT_MCP_CACHE_DIR=${WITT_MCP_CACHE_DIR:-}               # per-day read cache of the Layer 0 tools; empty => <repo>/mcp_cache
                                                                 # (needs WRITE permission in the container: the ZFIN expression TSV is ~44 MB)
      - OPENALEX_API_KEY=${OPENALEX_API_KEY:-}                   # optional; without it OpenAlex bills credits (~10/call, 1000/day measured 2026-09-15)
      - WITT_UNPAYWALL_EMAIL=${WITT_UNPAYWALL_EMAIL:-}           # REQUIRED by Unpaywall; empty => that source row is 'tool-unavailable' (declared)
      - WITT_ENSEMBL_MIN_INTERVAL_S=${WITT_ENSEMBL_MIN_INTERVAL_S:-0.07}      # rest.ensembl.org pacing (15 req/s documented)
      - WITT_ZFIN_EXPR_DOWNLOAD_BUDGET_S=${WITT_ZFIN_EXPR_DOWNLOAD_BUDGET_S:-180}   # once-a-day TSV download budget (43.7 MB measured, 27 s)
      - WITT_ZFIN_EXPR_MAX_MB=${WITT_ZFIN_EXPR_MAX_MB:-500}       # hard cap on that download
      - WITT_ZFIN_EXPR_SCAN_BUDGET_S=${WITT_ZFIN_EXPR_SCAN_BUDGET_S:-60}     # local scan budget of the cached TSV (243k lines, 0.5 s measured)
      - WITT_GEO_RETMAX=${WITT_GEO_RETMAX:-10}                   # GEO DataSets uids per esearch (clamp 1..500)
      # WITT_GEO_ORGANISM is deliberately NOT declared here: geo_gds treats a PRESENT-but-empty value as "disable the
      # [Organism] block" (declared organism_sent null); unset => 'Danio rerio'. Set it in Dokploy only when you mean it.
      - WITT_OPENALEX_PER_PAGE=${WITT_OPENALEX_PER_PAGE:-5}      # OpenAlex works per call (clamp 1..200)
      # ADR-0081 — política best-tier v2 y generación de modelos g2-2026-09. SÓLO placeholders: los defaults viven
      # DECLARADOS en analysis/scripts/lib/models.py (ENV_TABLE) y el valor efectivo + su fuente ('env:…' |
      # 'default-unset:…' | 'default-invalid-env:…') viajan en frozen.models, stage.models, audit.quorum y
      # /config-history.current. VACÍA = default declarado, jamás un crash. TODA ENV IMPLICA REINICIO: el os.environ
      # del contenedor se fija al arrancar el proceso — cambiar un valor en Dokploy NO surte efecto hasta
      # redeploy/restart (ADR-0081 Context 10); el ledger config_history registra el diff al arrancar
      # (changed_by 'system:boot-diff'). WITT_JUDGE_RETRIES (arriba, ADR-0080) entra al snapshot sin cambio.
      - WITT_MODEL_GENERATION=${WITT_MODEL_GENERATION:-g2-2026-09}   # generación de defaults y TOPES por rol; g1-2026-08 = f57a3d3 byte a byte (kill-switch)
      - WITT_MODEL_SYNTH=${WITT_MODEL_SYNTH:-}                       # sintetizador; vacía => default de la generación (claude-opus-5 en g2)
      - WITT_MODEL_PLANNER=${WITT_MODEL_PLANNER:-}                   # planner (POST /runs/plan); vacía => idem
      - WITT_MODEL_ELICIT=${WITT_MODEL_ELICIT:-}                     # elicitación de confianza (CONF_TOOL, ADR-0065); vacía => idem
      - WITT_MODEL_QUESTION=${WITT_MODEL_QUESTION:-}                 # agente de preguntas (question_agent); vacía => idem
      - WITT_JUDGE_CORRECTNESS=${WITT_JUDGE_CORRECTNESS:-}           # asiento correctness (anthropic); vacía => claude-opus-5 (g2) / claude-opus-4-8 (g1)
      - WITT_JUDGE_OVERCLAIM=${WITT_JUDGE_OVERCLAIM:-}               # asiento overclaim (anthropic); vacía => claude-sonnet-5
      - WITT_JUDGE_GROUNDING=${WITT_JUDGE_GROUNDING:-}               # asiento evidence-grounding (anthropic); vacía => claude-haiku-4-5-20251001, que se
                                                                     # retira >= 2026-10-15: el sucesor declarado claude-sonnet-5 se fija AQUÍ (ADR-0081 (E))
      - OPENAI_JUDGE_MODEL=${OPENAI_JUDGE_MODEL:-}                   # asiento reproducibility (openai; ya existía); vacía => gpt-4o; gpt-6-astra SÓLO tras LG3 (E1)
      - WITT_PANEL_AUTO_RETIRE=${WITT_PANEL_AUTO_RETIRE:-0}          # 1 = sucesor automático al llegar retire_not_before (declarado + fila runtime-diff); 0 = manual (E2)
      - WITT_PANEL_MIN_FAMILIES=${WITT_PANEL_MIN_FAMILIES:-2}        # cuórum de FAMILIAS con veredicto válido; 0|1 = kill-switch (gating false = regla de hoy)
      - WITT_PANEL_MIN_LENSES=${WITT_PANEL_MIN_LENSES:-3}            # cuórum de LENTES con veredicto válido; 0|1 = kill-switch
      - WITT_OPENAI_API=${WITT_OPENAI_API:-table}                    # table (la api de la tabla por modelo) | responses (fuerza Responses) | chat-completions (caller de hoy)
      - WITT_OPENAI_STORE=${WITT_OPENAI_STORE:-0}                    # `store` de responses.create (el default de la API es true = retención 30 días del lado OpenAI)
      - WITT_OPENAI_MAX_OUTPUT_TOKENS=${WITT_OPENAI_MAX_OUTPUT_TOKENS:-4000}   # TOPE (no gasto) del camino Responses; el camino chat conserva 1200
      - WITT_OPENAI_REASONING_EFFORT=${WITT_OPENAI_REASONING_EFFORT:-}        # low|medium|high; vacía = no se envía; sólo a modelos con reasoning True en la tabla
      - WITT_OPENAI_TIMEOUT_S=${WITT_OPENAI_TIMEOUT_S:-120}          # timeout por llamada del juez OpenAI; regla (1+WITT_JUDGE_RETRIES)×timeout×2 <= WITT_REAP_STALE_S
      - WITT_ANTHROPIC_EFFORT=${WITT_ANTHROPIC_EFFORT:-}             # output_config.effort (low|medium|high|xhigh|max) SÓLO a modelos thinking_default 'adaptive'; vacía = default de la API
      - WITT_ANTHROPIC_EFFORT_ELICIT=${WITT_ANTHROPIC_EFFORT_ELICIT:-}   # override sólo para CONF_TOOL (la mini-llamada de confianza); vacía = hereda WITT_ANTHROPIC_EFFORT
      - WITT_CONFIG_LEDGER=${WITT_CONFIG_LEDGER:-1}                  # 0 = cero escrituras en la tabla config_history (ledger_state lo dice); el archivo atestiguado no cambia
      # ADR-0082 — el consejo de criterio ejecutable (17 fichas verbatim como código; la ronda 1 es un JOB del plan que un
      # humano aprueba ANTES de gastar; la ronda 2 mide cobertura antes de la compuerta; el consejo JAMÁS escribe la
      # respuesta). SÓLO placeholders: las 27 env viven DECLARADAS en analysis/scripts/lib/models.py (ENV_TABLE, ENV_ADR_0082)
      # con lector tolerante en tiempo de llamada (vacía/basura = default declarado, jamás un crash) y el valor efectivo + su
      # fuente viajan en frozen.council.{config,cache,model,kill_switch}, plans.council_json.budget, GET /runs/plan.council.gates,
      # /config-history.current (role.council, council.enabled/full/effort/cache_ttl). TODA ENV IMPLICA REINICIO (ADR-0081
      # Context 10 / ADR-0082 L.1): el os.environ del contenedor se fija al arrancar — cambiar un valor en Dokploy NO surte
      # efecto hasta redeploy/restart; el ledger config_history registra el diff al arrancar. Kill-switch global:
      # WITT_COUNCIL=0 devuelve el camino de 9d90c01 con las excepciones DECLARADAS en el ADR (L.2).
      - WITT_COUNCIL=${WITT_COUNCIL:-1}                              # 0 = kill-switch: sin job en el plan, POST /runs sin 409, sin r2/r3, componente
                                                                     # 'kill-switch WITT_COUNCIL=0' (gating false), build_search_plan(directives=None)
      - WITT_COUNCIL_FULL=${WITT_COUNCIL_FULL:-0}                    # 1 = los 8 operativos también se sientan (N=25, cuórum 15) — E5: sólo A/B, 0 en prod;
                                                                     # se lee al ENCOLAR r1 (la corrida usa la N congelada en el plan)
      - WITT_MODEL_COUNCIL=${WITT_MODEL_COUNCIL:-}                   # modelo de los 17 miembros; vacía => claude-opus-5 (g2) / claude-opus-4-8 (g1);
                                                                     # fable rechazado 'excluded-model'; tope max_tokens.council 4000/1200 (techo, no gasto)
      - WITT_COUNCIL_EFFORT=${WITT_COUNCIL_EFFORT:-medium}           # output_config.effort FIJO por ruta para las 3 rondas (cambiarlo por petición invalida la
                                                                     # caché); low|medium|high|xhigh|max | 'inherit' (= hereda WITT_ANTHROPIC_EFFORT); sólo a
                                                                     # modelos thinking_default 'adaptive'; E2 (medium) se decide con thinking_tokens de LG1
      - WITT_CG_COUNCIL_COMPONENT=${WITT_CG_COUNCIL_COMPONENT:-1}    # 1 = council_uncovered_must GATEA (state checked|vacuous|incomplete); 0 = informativo declarado
      - WITT_COUNCIL_RECOVERAGE=${WITT_COUNCIL_RECOVERAGE:-1}        # 1 = ronda r3 de re-cobertura (sólo si la búsqueda admitió algo y sólo dueños de must sin
                                                                     # cubrir); 0 = post_search.state 'not-run (kill-switch WITT_COUNCIL_RECOVERAGE=0)'
      - WITT_COUNCIL_ORIGINS=${WITT_COUNCIL_ORIGINS:-production}     # orígenes del PROCESO que encolan r1 y que el council-worker RECLAMA (CSV; 'all' = sin
                                                                     # filtro); smoke/fixture/dev-offline => 'not-requested (origin …)' — cero llamadas de opus-5
      - WITT_COUNCIL_WORKERS=${WITT_COUNCIL_WORKERS:-1}              # hilos daemon council-worker-N que reclaman plans.council_state='queued' (0 = no arranca)
      - WITT_COUNCIL_DEDUP_S=${WITT_COUNCIL_DEDUP_S:-600}            # ventana del dedup del doble clic (misma pregunta+entidades+padre, mismo usuario, r1
                                                                     # queued|running => POST /runs/plan reutiliza el plan vivo: plan_response 'reused')
      - WITT_COUNCIL_MAX_QUEUED_PER_USER=${WITT_COUNCIL_MAX_QUEUED_PER_USER:-3}   # tope de jobs r1 'queued' por usuario; el excedente nace
                                                                     # 'not-requested (queue-cap per user)' (el plan sí se crea)
      - WITT_COUNCIL_CONCURRENCY=${WITT_COUNCIL_CONCURRENCY:-6}      # max_workers del pool por ronda (clamp 1..25); el miembro #1 va SOLO y el resto tras su respuesta
      - WITT_COUNCIL_MEMBER_TIMEOUT_S=${WITT_COUNCIL_MEMBER_TIMEOUT_S:-120}   # timeout por miembro; vencido => fila 'timeout' (abandonado y contado), la ronda sigue
      - WITT_COUNCIL_ROUND_BUDGET_S=${WITT_COUNCIL_ROUND_BUDGET_S:-300}       # presupuesto de reloj por ronda; agotado => 'skipped-budget' (cero llamadas) y en vuelo
                                                                     # abandonados/contados; regla 30 < 300 (vista) < 300 (ronda) <= WITT_REAP_STALE_S − 300
      - WITT_COUNCIL_MEMBER_RETRIES=${WITT_COUNCIL_MEMBER_RETRIES:-1}         # intentos ADICIONALES por miembro (transporte con Retry-After; contenido); refusal/4xx nunca
      - WITT_COUNCIL_QUORUM=${WITT_COUNCIL_QUORUM:-0.6}              # fracción de miembros válidos (ceil(q·N): 17 => 11, 25 => 15); fuera de (0,1] => 0.6 declarado
      - WITT_COUNCIL_MAX_REQUIREMENTS=${WITT_COUNCIL_MAX_REQUIREMENTS:-24}    # tope del ledger agregado (truncated, n_truncated, truncated_ids declarados)
      - WITT_COUNCIL_MAX_PER_MEMBER=${WITT_COUNCIL_MAX_PER_MEMBER:-5}         # requisitos por miembro que el CÓDIGO conserva (el schema fija maxItems 5: es identidad de la caché)
      - WITT_COUNCIL_R2_EVIDENCE_CHARS=${WITT_COUNCIL_R2_EVIDENCE_CHARS:-24000}   # tope de la vista de evidencia por miembro en r2/r3 (payload_truncated declarado; acota tokens/min)
      - WITT_COUNCIL_ATTESTATION_CHARS=${WITT_COUNCIL_ATTESTATION_CHARS:-4000}   # tope de knowledge_now y de cada attested_text en el ledger (600 en el frozen, truncated)
      - WITT_COUNCIL_CACHE=${WITT_COUNCIL_CACHE:-1}                  # 1 = cache_control en los DOS bloques del system (prefijo compartido + ficha); 0 = string (A/B medible)
      - WITT_COUNCIL_CACHE_TTL=${WITT_COUNCIL_CACHE_TTL:-5m}         # 5m (escritura 1.25×) | 1h (2×) para la ficha; con 1h el bloque A también va 1h (regla de la API:
                                                                     # una entrada 1h precede a las de 5m); E3 tras medir hit_ratio_r2 en LG3
      - WITT_COUNCIL_INDEX=${WITT_COUNCIL_INDEX:-1}                  # 0 = GET /council/search 503 declarado y prior_observations {state 'disabled'} (demand sigue contando)
      - WITT_COUNCIL_PRIOR_K=${WITT_COUNCIL_PRIOR_K:-5}              # observaciones previas inyectadas en r1 como PRIOR ART (letras P-A…; clamp 0..12; 0 = ninguna)
      - WITT_COUNCIL_PRIOR_KINDS=${WITT_COUNCIL_PRIOR_KINDS:-requirement,coverage,decision,gap_flag,panel_finding}   # kinds que ENTRAN al prompt de r1;
                                                                     # 'comment' EXCLUIDO por default (mitigación de inyección, R8) — la búsqueda siempre puede pedirlo
      - WITT_COUNCIL_INDEX_ORIGINS=${WITT_COUNCIL_INDEX_ORIGINS:-production}   # orígenes del corpus del índice y de /council/demand (NULL incluido y declarado, regla precedent)
      - WITT_ANTHROPIC_MAX_INFLIGHT=${WITT_ANTHROPIC_MAX_INFLIGHT:-8}          # BoundedSemaphore de PROCESO alrededor de urlopen para TODA llamada Anthropic (consejo,
                                                                     # síntesis, elicitación, planner, jueces); meta.queue_wait_s medido
      - WITT_ANTHROPIC_RETRY_AFTER_CAP_S=${WITT_ANTHROPIC_RETRY_AFTER_CAP_S:-30}   # tope al Retry-After honrado en http-429/529; sin cabecera, el backoff de hoy
      # ADR-0083 — figuras de papers como evidencia OBSERVADA (source-pointer: fig_id del JATS + sha256 recalculado al
      # gatear/servir/embeber + licencia por tabla CERRADA), su lectura como JUICIO en dos lentes del panel, y el PDF de
      # servidor COMPLETO (contrato 1.12). SÓLO placeholders: las 20 env viven DECLARADAS en analysis/scripts/lib/figures.py
      # (ENV_SPECS / env_config(), lector tolerante EN LA LLAMADA: vacía/basura/fuera de clamp = default declarado con fuente
      # 'default-unset:…' | 'default-invalid-env:…', jamás un crash) y el valor efectivo + su fuente viajan en
      # frozen.figures.{caps,cache,budget,license_table_env_ignored,vision}. WITT_MCP_CACHE_DIR (arriba, ADR-0080) es la 21ª:
      # las figuras la HONRAN (<dir>/figures/) — sin volumen la caché de bytes es EFÍMERA (E4, declarado: dir_state + 404
      # bytes-not-in-cache; el registro sha/dims/licencia sigue íntegro). TODA ENV IMPLICA REINICIO (ADR-0081 Context 10 /
      # ADR-0083 M.4): el os.environ del contenedor se fija al arrancar — cambiar un valor en Dokploy NO surte efecto hasta
      # redeploy/restart. Kill-switch maestro: WITT_FIGURES=0 = frozen 1.11 byte a byte salvo EXACTAMENTE 3 excepciones
      # declaradas (render_contract_version, figures{state,kill_switch}, deterministic_checks.figures{state}) — ADR-0083 (M.1).
      - WITT_FIGURES=${WITT_FIGURES:-1}                              # kill-switch maestro (M.1); 0 = no se parsea ni baja nada, el panel no ve imágenes,
                                                                     # GET /runs/{id}/figures/{sha} 404 'kill-switch WITT_FIGURES=0'
      - WITT_FIGURES_VISION=${WITT_FIGURES_VISION:-1}                # 0 = NINGUNA lente recibe imágenes; captions/sha/licencia/GET siguen (M.2)
      - WITT_FIGURES_VISION_LENSES=${WITT_FIGURES_VISION_LENSES:-evidence-grounding,reproducibility}   # CSV de <= 2 lentes validado contra models.LENSES;
                                                                     # fuera de vocabulario o > 2 lentes => default declarado (lenses_source 'default-invalid-env…'; corrector)
      - WITT_FIGURES_MAX_PAPERS=${WITT_FIGURES_MAX_PAPERS:-3}        # papers (con PMCID + XML) de los que se parsean/bajan figuras (clamp 1..50); resto paper-cap
      - WITT_FIGURES_MAX_PER_PAPER=${WITT_FIGURES_MAX_PER_PAPER:-9}  # figuras por paper en orden de documento (clamp 1..30)
      - WITT_FIGURES_MAX_PER_RUN=${WITT_FIGURES_MAX_PER_RUN:-12}     # tope de figuras bajadas por corrida (clamp 1..200); resto not-fetched (run-cap)
      - WITT_FIGURES_MAX_PER_LENS=${WITT_FIGURES_MAX_PER_LENS:-12}   # imágenes por petición de juez (clamp 0..20: <= 20 evita «many-image requests»)
      - WITT_FIGURES_MAX_IMAGE_MB=${WITT_FIGURES_MAX_IMAGE_MB:-5}    # bytes CRUDOS por imagen para panel/miniatura (clamp <= 7: 9.3 MB b64 < 10 MB de la API)
      - WITT_FIGURES_ZIP_MAX_MB=${WITT_FIGURES_ZIP_MAX_MB:-40}       # precheck Content-Length + tope de streaming del zip => not-fetched (zip-over-max), 0 bytes escritos
      - WITT_FIGURES_BUDGET_S=${WITT_FIGURES_BUDGET_S:-90}           # reloj TOTAL de stage.figures (fuera de la ronda de búsqueda); por paper min(45, restante) (constante)
      - WITT_FIGURES_TTL_DAYS=${WITT_FIGURES_TTL_DAYS:-30}           # frescura del ledger por PMCID; fresco + sha iguales => cache_hit, cero red; <=0 = nunca confiar
      - WITT_FIGURES_CACHE_MAX_MB=${WITT_FIGURES_CACHE_MAX_MB:-512}  # tope de <cache>/figures/; evicción LRU por mtime al escribir (evicted_n); 0 = sin tope declarado
      - WITT_FIGURES_CAPTION_CHARS=${WITT_FIGURES_CAPTION_CHARS:-2000}   # tope del caption que viaja (caption_truncated; clamp 100..20000); medido: media 1 030, máx 3 087
      - WITT_FIGURES_EMBED_LICENSES=${WITT_FIGURES_EMBED_LICENSES:-cc-by,cc0,cc-by-sa}   # sólo RESTRINGE la tabla lt-1 (ids fuera => license_table_env_ignored);
                                                                     # gobierna GET 200/403, miniatura de la Hoja y del PDF
      - WITT_FIGURES_PANEL_LICENSES=${WITT_FIGURES_PANEL_LICENSES:-cc-by,cc0,cc-by-sa,cc-by-nc,cc-by-nd,cc-by-nc-sa,cc-by-nc-nd,cc-by-prose-unconfirmed}
                                                                     # licencias cuyos bytes ven las lentes (E2: NC/ND SÍ — leer para juzgar no es redistribuir);
                                                                     # unknown y zfin-display-only NUNCA (no es env: tabla)
      - WITT_FIGURES_PROSE_LICENSE=${WITT_FIGURES_PROSE_LICENSE:-1}  # prosa «Creative Commons Attribution» sin URL => cc-by (source license-p-prose, visible);
                                                                     # 0 => cc-by-prose-unconfirmed (no embebible, panel sí) (E3)
      - WITT_FIGURES_OPENAI_DETAIL=${WITT_FIGURES_OPENAI_DETAIL:-high}    # detail del input_image (Responses) / image_url (chat): low|high|auto|original; a <= 840 px high = 2-4 tiles
      - WITT_FIGURES_REFETCH_ON_GET=${WITT_FIGURES_REFETCH_ON_GET:-0}    # 1 = ante bytes-not-in-cache UNA GET (20 s) y servir SOLO si sha == congelado (409 si no); default 0 (E4)
      - WITT_FIGURES_PDF_THUMBS=${WITT_FIGURES_PDF_THUMBS:-1}        # 0 = el PDF imprime palabras + enlace aunque la licencia permita la miniatura (M.3)
      - WITT_FIGURES_COUNT_TOKENS=${WITT_FIGURES_COUNT_TOKENS:-0}    # 1 = vision.tokens_measured por count_tokens SIN imágenes (una llamada gratuita por lente Anthropic)
      # ADR-0084 — la WEB como LOCALIZADOR de identificadores, jamás fuente (Brave Search REST sin modelo como primario; Anthropic
      # web_search como alterno EXPLÍCITO; resolutor DETERMINISTA URL→id; materialización SÓLO por Europe PMC; frozen.web_locator con
      # las URLs declaradas, contadas y jamás citadas — contrato 1.13). SÓLO placeholders: las 17 env viven DECLARADAS en
      # analysis/scripts/lib/web_locator.py (ENV_SPECS / env_config(), lector tolerante EN LA LLAMADA: vacía/basura = default declarado
      # con fuente 'default' | 'default-invalid-env:…', fuera de rango = recorte DECLARADO en cfg.clamped) y en models.ENV_TABLE
      # (ENV_ADR_0084, mismos defaults — paridad medida en smoke_models); el valor efectivo y su fuente viajan en
      # frozen.web_locator.{provider_source, allowed_hosts, generic_doi_rule, quota.cap_source} y en /config-history.current
      # (web.locator, web.provider). TODA ENV IMPLICA REINICIO (ADR-0081 Context 10 / ADR-0084 M.4). Kill-switch:
      # WITT_WEB_LOCATOR=off (o sin BRAVE_API_KEY: off DERIVADO) = frozen 1.12 byte a byte salvo EXACTAMENTE 3 excepciones declaradas
      # (render_contract_version, web_locator{state, provider, provider_source, kill_switch, state_vocabulary, rule},
      # deterministic_checks.web_locator{state}) — ADR-0084 (L).
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}                            # SECRETO: sólo en la pestaña Environment de Dokploy — never git, never vault, never
                                                                     # memoria; viaja SOLO en la cabecera X-Subscription-Token; en salida/ledger/caché/
                                                                     # fixture sólo su PRESENCIA (api_key_present); vacía => proveedor derivado 'off',
                                                                     # familia web 'unsatisfiable-by-harness (tool-unavailable (ADR-0084))', CERO red
      - WITT_WEB_LOCATOR=${WITT_WEB_LOCATOR:-}                      # brave | anthropic | off; vacía => derivado (brave si hay BRAVE_API_KEY, off si no);
                                                                     # off = kill-switch (L); anthropic es EXPLÍCITO (sin auto-failover: el despachador LEE texto web)
      - WITT_WEB_MAX_RESULTS=${WITT_WEB_MAX_RESULTS:-10}            # count por consulta a Brave (clamp 1..20, tope documentado); anthropic no aplica
      - WITT_WEB_MAX_QUERIES=${WITT_WEB_MAX_QUERIES:-3}             # consultas por ronda (una por directiva; clamp 1..10); sobrantes skipped-cap en calls[]
      - WITT_WEB_MAX_MATERIALIZE=${WITT_WEB_MAX_MATERIALIZE:-6}     # ids de literatura verificados en Europe PMC por ronda (clamp 0..20; 0 = sólo localizar)
      - WITT_WEB_MAX_QUERY_CHARS=${WITT_WEB_MAX_QUERY_CHARS:-400}   # tope NUESTRO de q (Brave no documenta longitud); query_truncated declarado
      - WITT_WEB_BUDGET_S=${WITT_WEB_BUDGET_S:-30}                  # presupuesto de la familia web dentro de la ronda (clamp 1..120): consultas + materialización
      - WITT_WEB_MIN_INTERVAL_S=${WITT_WEB_MIN_INTERVAL_S:-1.0}     # pacing PROPIO hacia api.search.brave.com (Brave publica 50 qps); throttle.waited_s medido
      - WITT_WEB_COUNTRY=${WITT_WEB_COUNTRY:-}                      # country de 2 letras; vacía => no se envía (country_sent null)
      - WITT_WEB_LANG=${WITT_WEB_LANG:-en}                          # search_lang ISO 639-1 (las query_en son inglés); presente y VACÍA => no se envía
      - WITT_WEB_FRESHNESS=${WITT_WEB_FRESHNESS:-}                  # pd | pw | pm | py | YYYY-MM-DDtoYYYY-MM-DD; fuera de forma => no se envía + freshness_ignored
      - WITT_WEB_ALLOWED_HOSTS=${WITT_WEB_ALLOWED_HOSTS:-}          # CSV que RESTRINGE los resolubles (host fuera => host-not-allowed); anthropic: allowed_domains (<= 20)
      - WITT_WEB_GENERIC_DOI_RULE=${WITT_WEB_GENERIC_DOI_RULE:-1}   # regla doi-in-url-any-host (confidence pattern-only; la existencia la verifica EPMC); 0 = sólo hosts de la tabla
      - WITT_WEB_MONTHLY_CAP=${WITT_WEB_MONTHLY_CAP:-900}           # tope mensual UTC de consultas facturables por proveedor (tabla web_locator_usage, UPDATE condicional
                                                                     # atómico); alcanzado => skipped-cap con detail, CERO red; 0 = sin tope declarado (OE2)
      - WITT_WEB_TEST_QUERY=${WITT_WEB_TEST_QUERY:-}                # consulta EXPLÍCITA del operador cuando web entra por WITT_SEARCH_DEFAULT_FAMILIES; nunca en producción
      - WITT_ANTHROPIC_WEB_SEARCH_MAX_USES=${WITT_ANTHROPIC_WEB_SEARCH_MAX_USES:-1}   # max_uses del server-tool web_search (una directiva = una búsqueda; clamp 1..5)
      - WITT_WEB_ANTHROPIC_TOOL_TYPE=${WITT_WEB_ANTHROPIC_TOOL_TYPE:-web_search_20250305}   # literal del type: VOCABULARIO CERRADO (sólo web_search_20250305, sin dynamic filtering); otro literal = default + default-invalid-env (corrector)
      - WITT_WEB_LOCATOR_MODEL=${WITT_WEB_LOCATOR_MODEL:-}          # modelo del despachador del alterno (validado contra models.MODELS); vacía => rol elicitation; FUERA de PIPELINE_ROLES
    healthcheck:                                       # process-liveness only: no auth, no network, no spend
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8078/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s                                # lifespan preloads sklearn + warms dense before serving
networks:
  default: {}
  neo4j_net:
    external: true
    name: rag-emma-mequsz_default                      # the Neo4j stack's network (same as the ingest service)
  minio_net:
    external: true
    name: rag-datainamovibleminio-grjoil_default       # the MinIO stack's network
  dokploy-network:
    external: true
    name: dokploy-network                              # where the native Dokploy Postgres lives
