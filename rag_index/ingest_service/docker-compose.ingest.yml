# Hosted ingestion service on Dokploy (ADR-0017/0021). Lets teammates COMPLEMENT the source of truth
# without the repo or write credentials; the human gate (admin token /approve) is preserved.
# Deploy from git (Dokploy → Compose → your repo); build context is the repo root.
# Set the tokens + connection secrets in the Dokploy Environment tab (NEVER commit them — §7).
services:
  ingest:
    build:
      context: ../..                                  # repo root (Dockerfile copies analysis/ + rag_index/)
      dockerfile: rag_index/ingest_service/Dockerfile
    restart: unless-stopped
    # Neo4j + MinIO run as SEPARATE Dokploy stacks. Join their docker networks (external) and reach them
    # by SERVICE NAME on the INTERNAL ports — bypasses host hairpin/firewall entirely.
    # Env: NEO4J_URI=bolt://neo4j:7687 , MINIO_ENDPOINT=minio:9000
    networks: [default, neo4j_net, minio_net]
    ports:
      - "8077:8077"
    environment:
      - INGEST_SUBMIT_TOKEN=${INGEST_SUBMIT_TOKEN}    # teammates (submit)
      - INGEST_ADMIN_TOKEN=${INGEST_ADMIN_TOKEN}      # the approver (human gate)
      - NEO4J_URI=${NEO4J_URI}                        # Neo4j + MinIO are SEPARATE Dokploy stacks -> reach
      - NEO4J_USER=${NEO4J_USER}                      # them via the host IP + published ports, e.g.
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}              # NEO4J_URI=bolt://<host-ip>:7687 (not a service name)
      - RAG_BACKEND=neo4j
      - EMBED_MODEL=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}              # e.g. <host-ip>:9100 (the published MinIO API port)
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=false
      - GITHUB_TOKEN=${GITHUB_TOKEN}                  # push-back: commit the approved manifest to git (Contents API)
      - GITHUB_REPO=Emma-NukeAI/Witt-organo           # leave GITHUB_TOKEN empty to disable push-back (maintainer syncs)
      - GITHUB_BRANCH=master
    volumes:
      - ingest_queue:/data/queue                      # pending submissions survive restarts
networks:
  default: {}
  neo4j_net:
    external: true
    name: rag-emma-mequsz_default                     # the Neo4j stack's docker network (from its deploy)
  minio_net:
    external: true
    name: rag-datainamovibleminio-grjoil_default      # the MinIO stack's docker network (from its deploy)
volumes:
  ingest_queue:
